<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de vehículos</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#0f1b2d;--mu:#5b6779;--pr:#0b3d91;--pr2:#e6edf9;--on:#fff;--bd:#d8dee9;--ok:#14794b;--bad:#b3261e;--out:#8a5a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1320;--card:#161e2e;--tx:#e8edf6;--mu:#9aa6b8;--pr:#6e9bff;--pr2:#1d2a45;--on:#0d1320;--bd:#2a3550;--ok:#4cc38a;--bad:#ff8a80;--out:#f0b44c}}
:root[data-theme="dark"]{--bg:#0d1320;--card:#161e2e;--tx:#e8edf6;--mu:#9aa6b8;--pr:#6e9bff;--pr2:#1d2a45;--on:#0d1320;--bd:#2a3550;--ok:#4cc38a;--bad:#ff8a80;--out:#f0b44c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.2px}
.logo{height:26px;width:auto;opacity:.9;flex:none}
.back{background:none;border:0;color:var(--pr);font-size:15px;cursor:pointer;padding:6px 0}
.big{display:grid;gap:14px;margin:24px 0}
.bigbtn{display:flex;flex-direction:column;gap:4px;text-align:left;padding:26px 22px;border-radius:14px;border:0;cursor:pointer;font:inherit;color:var(--on);background:var(--pr)}
.bigbtn.s{background:var(--card);color:var(--tx);border:2px solid var(--pr)}
.bigbtn b{font-size:26px}.bigbtn span{opacity:.85;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:0 0 16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}.stat small{color:var(--mu)}
form,.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
label small{font-weight:400;color:var(--mu)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:11px 12px;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--pr);outline-offset:1px}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:46px;padding:0 18px;border-radius:10px;border:0;background:var(--pr);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--pr2);color:var(--pr)}.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.full{width:100%;margin-top:18px}
.err{color:var(--bad);font-size:14px;margin-top:6px;min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:5}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tools .wide{grid-column:1/-1}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--pr);color:var(--on);border-color:var(--pr)}
.v{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ok);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.v.out{border-left-color:var(--out)}
.v h3{margin:0 0 2px;font-size:17px}
.v .m{color:var(--mu);font-size:14px}
.v .vin{font-family:ui-monospace,Consolas,monospace;font-size:14px;word-break:break-all}
.tag{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600;margin-right:6px}
.tag.o{background:transparent;border:1px solid var(--out);color:var(--out)}
.vb{display:flex;gap:8px;margin-top:10px}.vb .btn{min-height:38px;font-size:14px;padding:0 12px}
.empty{text-align:center;color:var(--mu);padding:32px 12px}
.hide{display:none}
.tbl{overflow-x:auto}
@media(prefers-reduced-motion:no-preference){.toast{animation:t .2s}@keyframes t{from{opacity:0}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var MODELOS=["Territory","Ranger","F-150","Explorer","Bronco","Bronco Sport","Expedition","Maverick","Transit","Transit bus","Mustang"];
var UBIC=["Salón","Vitrina","Patio","Subterráneo","Equipador"];
var KEY="inventario-ford-v1",data=[],filtro={q:"",ubic:"",modelo:"",est:"stock"};

function hoy(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function fmt(f){if(!f)return"";var p=f.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function opts(arr,ph){return '<option value="">'+ph+'</option>'+arr.map(function(x){return'<option>'+esc(x)+'</option>'}).join("")}
function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
function stock(){return data.filter(function(v){return!v.fechaSalida})}

function head(t){return'<header>'+(vista()!=="inicio"?'<button class="back" onclick="go(\'\')">‹ Inicio</button>':'')+'<h1>'+t+'</h1><img class="logo" src="'+LOGO+'" alt="Ford">'+'</header>'}

function render(){
  var v=vista(),a=$("#app");
  if(v==="inicio")a.innerHTML=inicio();
  else if(v==="ingresar"){a.innerHTML=ingresar();$("#fIng").onsubmit=guardarIng}
  else if(v==="salida"){a.innerHTML=salida();bindSalida()}
  else{a.innerHTML=inventario();bindInv();lista()}
  window.scrollTo(0,0);
}
function inicio(){
  var s=stock();
  return head("Inventario de vehículos")+
  '<div class="big"><button class="bigbtn" onclick="go(\'ingresar\')"><b>Ingresar</b><span>Registrar un vehículo nuevo en el inventario</span></button>'+
  '<button class="bigbtn s" onclick="go(\'salida\')"><b>Salida</b><span>Registrar la salida de un vehículo</span></button></div>'+
  '<div class="stats"><div class="stat"><b>'+s.length+'</b><small>En stock</small></div><div class="stat"><b>'+(data.length-s.length)+'</b><small>Con salida</small></div></div>'+
  '<button class="btn g full" onclick="go(\'inventario\')">Ver inventario</button>';
}
function ingresar(){
  return head("Ingresar vehículo")+'<form id="fIng" novalidate>'+
  '<label for="modelo">Modelo</label><select id="modelo" required>'+opts(MODELOS,"Elegir modelo")+'</select>'+
  '<label for="version">Versión</label><input id="version" required autocomplete="off">'+
  '<label for="color">Color</label><input id="color" required autocomplete="off">'+
  '<label for="vin">VIN <small>17 caracteres</small></label><input id="vin" required maxlength="17" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase">'+
  '<label for="fe">Fecha de entrada</label><input type="date" id="fe" value="'+hoy()+'" required>'+
  '<label for="ubic">Inventario</label><select id="ubic" required>'+opts(UBIC,"Elegir ubicación")+'</select>'+
  '<label for="vend">Vendedor <small>(opcional)</small></label><input id="vend" autocomplete="off">'+
  '<label for="obs">Observación <small>(opcional)</small></label><textarea id="obs"></textarea>'+
  '<div class="err" id="err" role="alert"></div><button class="btn full" type="submit">Guardar ingreso</button></form>';
}
function guardarIng(e){
  e.preventDefault();
  var g=function(i){return $("#"+i).value.trim()},vin=g("vin").toUpperCase(),er=$("#err");
  if(!g("modelo")||!g("version")||!g("color")||!g("fe")||!g("ubic")){er.textContent="Completa modelo, versión, color, fecha e inventario.";return}
  if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){er.textContent="El VIN debe tener 17 caracteres (letras y números, sin I, O ni Q).";return}
  if(data.some(function(x){return x.vin===vin&&!x.fechaSalida})){er.textContent="Ese VIN ya está en stock.";return}
  data.unshift({id:Date.now().toString(36),modelo:g("modelo"),version:g("version"),color:g("color"),vin:vin,fechaEntrada:g("fe"),ubic:g("ubic"),vendedor:g("vend"),obs:g("obs"),fechaSalida:null});
  save();toast("Ingreso guardado");go("");
}
function salida(){
  return head("Salida de vehículo")+'<form id="fSal" novalidate>'+
  '<label for="m">Modelo</label><select id="m">'+opts(MODELOS,"Elegir modelo")+'</select>'+
  '<label for="u">Versión</label><select id="u" disabled><option value="">Primero elige un modelo</option></select>'+
  '<div class="panel hide" id="det" style="margin-top:14px"></div>'+
  '<label for="fs">Fecha de salida</label><input type="date" id="fs" value="'+hoy()+'">'+
  '<div class="err" id="err" role="alert"></div><button class="btn full" type="submit">Guardar salida</button></form>';
}
function bindSalida(){
  var m=$("#m"),u=$("#u");
  m.onchange=function(){
    var l=stock().filter(function(v){return v.modelo===m.value});
    $("#det").classList.add("hide");
    if(!m.value){u.disabled=true;u.innerHTML='<option value="">Primero elige un modelo</option>';return}
    if(!l.length){u.disabled=true;u.innerHTML='<option value="">No hay unidades en stock</option>';return}
    u.disabled=false;
    u.innerHTML='<option value="">Elegir versión</option>'+l.map(function(v){return'<option value="'+v.id+'">'+esc(v.version)+" - "+esc(v.color)+" - "+esc(v.vin.slice(-6))+'</option>'}).join("");
  };
  u.onchange=function(){
    var v=data.filter(function(x){return x.id===u.value})[0],d=$("#det");
    if(!v){d.classList.add("hide");return}
    d.classList.remove("hide");
    d.innerHTML='<b>'+esc(v.modelo)+" "+esc(v.version)+'</b><div class="m">Color '+esc(v.color)+' · '+esc(v.ubic)+' · Entrada '+fmt(v.fechaEntrada)+'</div><div class="vin">'+esc(v.vin)+'</div>';
  };
  $("#fSal").onsubmit=function(e){
    e.preventDefault();
    var v=data.filter(function(x){return x.id===u.value})[0],f=$("#fs").value,er=$("#err");
    if(!v){er.textContent="Elige el modelo y la versión del vehículo.";return}
    if(!f){er.textContent="Elige la fecha de salida.";return}
    if(f<v.fechaEntrada){er.textContent="La salida no puede ser antes de la entrada ("+fmt(v.fechaEntrada)+").";return}
    v.fechaSalida=f;save();toast("Salida guardada");go("");
  };
}
function inventario(){
  var s=stock(),c={};UBIC.forEach(function(x){c[x]=s.filter(function(v){return v.ubic===x}).length});
  return head("Inventario")+
  '<div class="stats"><div class="stat"><b>'+s.length+'</b><small>En stock</small></div>'+UBIC.map(function(x){return'<div class="stat"><b>'+c[x]+'</b><small>'+x+'</small></div>'}).join("")+'</div>'+
  '<div class="chips" role="group" aria-label="Estado"><button class="chip" data-e="stock">En stock</button><button class="chip" data-e="salidos">Con salida</button><button class="chip" data-e="todos">Todos</button></div>'+
  '<div class="tools"><select id="fm" aria-label="Modelo">'+opts(MODELOS,"Todos los modelos")+'</select><select id="fu" aria-label="Ubicación">'+opts(UBIC,"Todas las ubicaciones")+'</select>'+
  '<input class="wide" id="q" type="search" placeholder="Buscar por VIN, versión, color o vendedor" aria-label="Buscar"></div>'+
  '<div id="lst"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn g" id="exp" style="flex:1">Exportar CSV</button><button class="btn g" id="bak" style="flex:1">Copia de seguridad</button></div>'+
  '<input type="file" id="imp" accept=".json" class="hide"><button class="btn g full" id="rest">Restaurar copia</button>';
}
function bindInv(){
  $("#fm").value=filtro.modelo;$("#fu").value=filtro.ubic;$("#q").value=filtro.q;
  $("#fm").onchange=function(){filtro.modelo=this.value;lista()};
  $("#fu").onchange=function(){filtro.ubic=this.value;lista()};
  $("#q").oninput=function(){filtro.q=this.value;lista()};
  document.querySelectorAll(".chip").forEach(function(b){b.onclick=function(){filtro.est=b.dataset.e;lista()}});
  $("#exp").onclick=csv;$("#bak").onclick=backup;
  $("#rest").onclick=function(){$("#imp").click()};$("#imp").onchange=restore;
}
function lista(){
  document.querySelectorAll(".chip").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.e===filtro.est)});
  var q=filtro.q.toLowerCase();
  var l=data.filter(function(v){
    if(filtro.est==="stock"&&v.fechaSalida)return false;
    if(filtro.est==="salidos"&&!v.fechaSalida)return false;
    if(filtro.modelo&&v.modelo!==filtro.modelo)return false;
    if(filtro.ubic&&v.ubic!==filtro.ubic)return false;
    return!q||[v.vin,v.version,v.color,v.vendedor,v.obs].join(" ").toLowerCase().indexOf(q)>-1;
  });
  $("#lst").innerHTML=l.length?l.map(function(v){
    var o=!!v.fechaSalida;
    return'<div class="v'+(o?" out":"")+'"><h3>'+esc(v.modelo)+" "+esc(v.version)+'</h3><div class="m">'+esc(v.color)+'</div><div class="vin">'+esc(v.vin)+'</div>'+
    '<div style="margin:8px 0 2px"><span class="tag'+(o?" o":"")+'">'+(o?"Salió":esc(v.ubic))+'</span><span class="m">Entrada '+fmt(v.fechaEntrada)+(o?" · Salida "+fmt(v.fechaSalida):"")+'</span></div>'+
    (v.vendedor?'<div class="m">Vendedor: '+esc(v.vendedor)+'</div>':"")+(v.obs?'<div class="m">'+esc(v.obs)+'</div>':"")+
    '<div class="vb">'+(o?'<button class="btn g" onclick="deshacer(\''+v.id+'\')">Deshacer salida</button>':'<button class="btn g" onclick="mover(\''+v.id+'\')">Cambiar ubicación</button>')+'<button class="btn d" onclick="borrar(\''+v.id+'\')">Eliminar</button></div></div>';
  }).join(""):'<div class="empty">No hay vehículos con estos filtros. Usa Ingresar para registrar el primero.</div>';
}
function mover(id){
  var v=data.filter(function(x){return x.id===id})[0];
  var n=prompt("Nueva ubicación ("+UBIC.join(", ")+"):",v.ubic);
  if(n===null)return;
  var m=UBIC.filter(function(x){return x.toLowerCase()===n.trim().toLowerCase()})[0];
  if(!m){toast("Ubicación no válida");return}
  v.ubic=m;save();lista();toast("Ubicación actualizada");
}
function deshacer(id){data.forEach(function(v){if(v.id===id)v.fechaSalida=null});save();lista();toast("Salida deshecha")}
function borrar(id){if(!confirm("¿Eliminar este vehículo del registro?"))return;data=data.filter(function(v){return v.id!==id});save();lista()}
function csv(){
  var c=["Modelo","Versión","Color","VIN","Fecha entrada","Inventario","Vendedor","Observación","Fecha salida"];
  var r=data.map(function(v){return[v.modelo,v.version,v.color,v.vin,v.fechaEntrada,v.ubic,v.vendedor,v.obs,v.fechaSalida||""].map(function(x){return'"'+String(x||"").replace(/"/g,'""')+'"'}).join(";")});
  bajar("\ufeff"+[c.join(";")].concat(r).join("\n"),"inventario-ford.csv","text/csv");
}
function backup(){bajar(JSON.stringify(data),"inventario-ford-respaldo.json","application/json")}
function bajar(t,n,ty){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function restore(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;data=d;save();lista();toast("Copia restaurada")}catch(e){toast("Archivo no válido")}};
  r.readAsText(f);
}

async function programarAvisos(){
  var LN = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.LocalNotifications;
  if(!LN) return; // en el navegador no hace nada
  var p = await LN.requestPermissions();
  if(p.display !== "granted") return;
  await LN.cancel({notifications:[{id:1},{id:2}]});
  var n = stock().length;
  await LN.schedule({notifications:[
    {id:1, title:"Inventario Ford", body:"Buenos días. Hay "+n+" vehículos en stock.",
     schedule:{on:{hour:10, minute:0}, allowWhileIdle:true}},
    {id:2, title:"Inventario Ford", body:"Recuerda registrar los ingresos y salidas de hoy.",
     schedule:{on:{hour:15, minute:0}, allowWhileIdle:true}}
  ]});
}
programarAvisos();

var APP = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
if (APP) {
  APP.addListener("backButton", function () {
    if (vista() !== "inicio") go("");   // desde cualquier pantalla vuelve al inicio
    else APP.exitApp();                 // desde el inicio cierra la app
  });
}

window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
