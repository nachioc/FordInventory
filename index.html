<script>

var UBIC=["Salón","Vitrina","Patio","Subterráneo","Equipador"];
var ESTADOS=["Disponible","Reservado","Vendido"],EC={Disponible:"dis",Reservado:"res",Vendido:"ven"},editId=null;
var KEY="inventario-ford-v1",data=[],filtro={q:"",ubic:"",modelo:"",est:"stock",ven:""};
var SB_URL="https://gvpvnonksgiqlbxiuugf.supabase.co",SB_KEY="sb_publishable_W8AKcqspBXlUpohpzNklyw_O6MWnJ2r";
var db=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:"implicit"}}),recup=false,sesion=null,perfil=null;
function aDB(v){return{modelo:v.modelo,version:v.version,color:v.color,vin:v.vin,fecha_entrada:v.fechaEntrada,ubicacion:v.ubic,estado:v.estado||"Disponible",vendedor:v.vendedor||null,observacion:v.obs||null,fecha_salida:v.fechaSalida||null}}
function deDB(r){return{id:r.id,modelo:r.modelo,version:r.version,color:r.color,vin:r.vin,fechaEntrada:r.fecha_entrada,ubic:r.ubicacion,estado:r.estado,vendedor:r.vendedor||"",obs:r.observacion||"",fechaSalida:r.fecha_salida}}
function msgErr(e){return e&&e.code==="23505"?"Ese VIN ya está en stock.":"No se pudo guardar (revisa tu permiso o tu conexión)."}
async function cargar(){var r=await db.from("vehiculos").select("*").order("created_at",{ascending:false});data=(r.data||[]).map(deDB)}
async function cargarTodo(){var p=await db.from("perfiles").select("*").eq("id",sesion.user.id).maybeSingle();perfil=p.data;if(perfil&&perfil.activo){await cargar();await cargarEntregas();await cargarNotifs();suscribir()}}
async function guardarDB(v,er){var r=await db.from("vehiculos").update(aDB(v)).eq("id",v.id).select();if(r.error||!r.data.length){er.textContent=msgErr(r.error);await cargar();return false}return true}
async function insertarDB(v,er){var r=await db.from("vehiculos").insert(aDB(v)).select().single();if(r.error){er.textContent=msgErr(r.error);return null}return deDB(r.data)}
async function iniciar(){$("#app").innerHTML='<div class="empty">Cargando...</div>';var s=await db.auth.getSession();sesion=s.data.session;if(sesion)await cargarTodo();render()}
async function entrar(registro){
  var em=$("#em").value.trim(),pw=$("#pw").value,er=$("#err");
  if(!em||pw.length<6){er.textContent="Ingresa tu correo y una contraseña de al menos 6 caracteres.";return}
  var r=registro?await db.auth.signUp({email:em,password:pw}):await db.auth.signInWithPassword({email:em,password:pw});
  if(r.error){er.textContent=registro?"No se pudo crear la cuenta: "+r.error.message:"Correo o contraseña incorrectos.";return}

  sesion=r.data.session;await cargarTodo();render()
}
async function salir(){if(canal){db.removeChannel(canal);canal=null}await db.auth.signOut();sesion=null;perfil=null;data=[];document.body.className="";go("");render()}
function loginView(){return'<div class="hero"><img src="'+LOGO+'" alt="Ford Inventario"><h1>Inventario Ford</h1><p>Inventario y planificador de entregas</p></div><form id="fLog" novalidate><label for="em">Correo</label><input id="em" type="email" autocomplete="username"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="err" role="alert"></div><button class="btn full" type="submit">Entrar</button><button class="btn g full" type="button" id="reg">Crear cuenta</button><button type="button" class="back" id="olv" style="display:block;margin:14px auto 0">¿Olvidaste tu contraseña?</button></form>'}
function render(){

  document.body.className="r-"+perfil.rol;
  var v=vista();
  if((v==="usuarios"||v==="historial")&&perfil.rol!=="admin"){go("");return}
  renderApp();

}
async function usuarios(){
  var a=$("#app");a.innerHTML=head("Usuarios y roles")+'<div id="ul" class="empty">Cargando...</div>';

function head(t){return'<header>'+(vista()!=="portada"?'<button class="back" onclick="go(atras())">‹ Volver</button>':'')+'<h1>'+t+'</h1><img class="logo" src="'+LOGO+'" alt="Ford">'+'</header>'}

function renderApp(){
  var v=vista(),a=$("#app");
  if(v==="inicio")a.innerHTML=inicio();
  else if(v==="editar"&&!editId){go("");return}
  else if(v==="ingresar"||v==="editar"){if(v==="ingresar")editId=null;a.innerHTML=ingresar();$("#fIng").onsubmit=guardarIng;$("#scan").onclick=function(){$("#foto").click()};$("#foto").onchange=leerVin;$("#vin").oninput=autoVin;llenar()}
  else if(v==="salida"){a.innerHTML=salida();bindSalida()}
  else if(v==="portada"){a.innerHTML=portada()}
  else if(v==="plan"){a.innerHTML=planVista();bindPlan();listaPlan()}
  else if(v==="pform"){var ee=editE?ent.filter(function(x){return x.id===editE})[0]:null;if(editE?!(ee&&(puedeEditar(ee)||perfil.rol==="preparador")):!puedeCrear()){go("plan");return}a.innerHTML=pform();bindPform()}
  else if(v==="alertas"){a.innerHTML=alertasVista();bindAlertas()}
  else if(v==="usuarios"){usuarios()}
  else if(v==="historial"){historial()}
  else{a.innerHTML=inventario();bindInv();lista()}
  window.scrollTo(0,0);pintaNav();
}
function inicio(){
  var s=stock();
  return head("Inventario de vehículos")+
  '<div class="big"><button class="bigbtn" onclick="go(\'ingresar\')"><b>Ingresar</b><span>Registrar un vehículo nuevo en el inventario</span></button>'+
  '<button class="bigbtn s" onclick="go(\'salida\')"><b>Salida</b><span>Registrar la salida de un vehículo</span></button></div>'+
  '<div class="stats"><div class="stat"><b>'+s.length+'</b><small>En stock</small></div><div class="stat"><b>'+(data.length-s.length)+'</b><small>Con salida</small></div></div>'+
  '<button class="btn g full" onclick="go(\'inventario\')">Ver inventario</button>';
}
function ingresar(){
  return head(editId?"Actualizar vehículo":"Ingresar vehículo")+'<form id="fIng" novalidate>'+
  '<label for="modelo">Modelo</label><select id="modelo" required>'+opts(MODELOS,"Elegir modelo")+'</select>'+
  '<label for="version">Versión</label><input id="version" required autocomplete="off">'+
  '<label for="color">Color</label><input id="color" required autocomplete="off">'+
  '<label for="vin">VIN <small>17 caracteres</small></label><div class="vinrow"><input id="vin" required maxlength="17" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase"><button type="button" class="btn g" id="scan">Escanear</button></div><input type="file" id="foto" accept="image/*" capture="environment" class="hide"><div id="scanmsg" role="status" style="color:var(--mu);font-size:14px;margin-top:6px">Apunta al código cuadrado del parabrisas o a la etiqueta del VIN.</div>'+
  '<label for="fe">Fecha de entrada</label><input type="date" id="fe" value="'+hoy()+'" required>'+
  '<label for="ubic">Inventario</label><select id="ubic" required>'+opts(UBIC,"Elegir ubicación")+'</select>'+'<label for="estado">Estado</label><select id="estado">'+ESTADOS.map(function(x){return'<option>'+x+'</option>'}).join("")+'</select>'+(editando()&&editando().fechaSalida?'<label for="fsal">Fecha de salida</label><input type="date" id="fsal">':'')+
  '<label for="vend">Vendedor <small>(opcional)</small></label><input id="vend" autocomplete="off">'+
  '<label for="obs">Observación <small>(opcional)</small></label><textarea id="obs"></textarea>'+
  '<div class="err" id="err" role="alert"></div><button class="btn full" type="submit">'+(editId?"Guardar cambios":"Guardar ingreso")+'</button></form>';
}
async function guardarIng(e){
  e.preventDefault();
  var g=function(i){return $("#"+i).value.trim()},vin=g("vin").toUpperCase(),er=$("#err");
  if(!g("modelo")||!g("version")||!g("color")||!g("fe")||!g("ubic")){er.textContent="Completa modelo, versión, color, fecha e inventario.";return}
  if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){er.textContent="El VIN debe tener 17 caracteres (letras y números, sin I, O ni Q).";return}
  if(data.some(function(x){return x.vin===vin&&!x.fechaSalida&&x.id!==editId})){er.textContent="Ese VIN ya está en stock.";return}
  var r={modelo:g("modelo"),version:g("version"),color:g("color"),vin:vin,fechaEntrada:g("fe"),ubic:g("ubic"),estado:g("estado")||"Disponible",vendedor:g("vend"),obs:g("obs")},fs=$("#fsal")?$("#fsal").value:"";
  if(fs&&fs<r.fechaEntrada){er.textContent="La salida no puede ser antes de la entrada.";return}
  if(editId){var v=editando();for(var k in r)v[k]=r[k];if(fs)v.fechaSalida=fs;if(!await guardarDB(v,er))return;toast("Cambios guardados");editId=null;go("inventario");return}
  r.fechaSalida=null;var nv=await insertarDB(r,er);if(!nv)return;data.unshift(nv);
  toast("Ingreso guardado");go("inv");
}
function salida(){
  return head("Salida de vehículo")+'<form id="fSal" novalidate>'+
  '<label for="m">Modelo</label><select id="m">'+opts(MODELOS,"Elegir modelo")+'</select>'+
  '<label for="u">Versión</label><select id="u" disabled><option value="">Primero elige un modelo</option></select>'+
  '<div class="panel hide" id="det" style="margin-top:14px"></div>'+
  '<label for="fs">Fecha de salida</label><input type="date" id="fs" value="'+hoy()+'">'+
  '<div class="err" id="err" role="alert"></div><button class="btn full" type="submit">Guardar salida</button></form>';
}
function bindSalida(){
  var m=$("#m"),u=$("#u");
  m.onchange=function(){
    var l=stock().filter(function(v){return v.modelo===m.value});
    $("#det").classList.add("hide");
    if(!m.value){u.disabled=true;u.innerHTML='<option value="">Primero elige un modelo</option>';return}
    if(!l.length){u.disabled=true;u.innerHTML='<option value="">No hay unidades en stock</option>';return}
    u.disabled=false;
    u.innerHTML='<option value="">Elegir versión</option>'+l.map(function(v){return'<option value="'+v.id+'">'+esc(v.version)+" - "+esc(v.color)+" - "+esc(v.vin.slice(-6))+'</option>'}).join("");
  };
  u.onchange=function(){
    var v=data.filter(function(x){return x.id===u.value})[0],d=$("#det");
    if(!v){d.classList.add("hide");return}
    d.classList.remove("hide");
    d.innerHTML='<b>'+esc(v.modelo)+" "+esc(v.version)+'</b><div class="m">Color '+esc(v.color)+' · '+esc(v.ubic)+' · Entrada '+fmt(v.fechaEntrada)+'</div><div class="vin">'+esc(v.vin)+'</div>';
  };
  $("#fSal").onsubmit=async function(e){
    e.preventDefault();
    var v=data.filter(function(x){return x.id===u.value})[0],f=$("#fs").value,er=$("#err");
    if(!v){er.textContent="Elige el modelo y la versión del vehículo.";return}
    if(!f){er.textContent="Elige la fecha de salida.";return}
    if(f<v.fechaEntrada){er.textContent="La salida no puede ser antes de la entrada ("+fmt(v.fechaEntrada)+").";return}
    v.fechaSalida=f;if(!await guardarDB(v,er))return;toast("Salida guardada");go("inv");
  };
}
function inventario(){
  var s=stock(),c={};UBIC.forEach(function(x){c[x]=s.filter(function(v){return v.ubic===x}).length});
  return head("Inventario")+
  '<div class="stats"><div class="stat"><b>'+s.length+'</b><small>En stock</small></div>'+UBIC.map(function(x){return'<div class="stat"><b>'+c[x]+'</b><small>'+x+'</small></div>'}).join("")+'</div>'+
  '<div class="chips" role="group" aria-label="Estado"><button class="chip" data-e="stock">En stock</button><button class="chip" data-e="salidos">Con salida</button><button class="chip" data-e="todos">Todos</button></div>'+
  '<div class="tools"><select id="fm" aria-label="Modelo">'+opts(MODELOS,"Todos los modelos")+'</select><select id="fu" aria-label="Ubicación">'+opts(UBIC,"Todas las ubicaciones")+'</select>'+
  '<select class="wide" id="fv" aria-label="Estado del vehículo">'+opts(ESTADOS,"Todos los estados")+'</select><input class="wide" id="q" type="search" placeholder="Buscar por VIN, versión, color o vendedor" aria-label="Buscar"><button class="btn g wide" id="lim" type="button">Limpiar filtros</button></div>'+
  '<div id="lst"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn g" id="exp" style="flex:1">Exportar CSV</button></div>'+
  '';
}
function bindInv(){
  $("#fm").value=filtro.modelo;$("#fu").value=filtro.ubic;$("#q").value=filtro.q;
  $("#fm").onchange=function(){filtro.modelo=this.value;lista()};
  $("#fu").onchange=function(){filtro.ubic=this.value;lista()};

function cargarZx(){return new Promise(function(ok,no){if(window.ZXingWASM)return ok();var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js";s.onload=ok;s.onerror=function(){no(new Error("sin conexión"))};document.head.appendChild(s)})}
async function leerCodigo(img){
  var tam=[1600,2400];
  for(var k=0;k<tam.length;k++){
    var w=Math.min(tam[k],img.width),h=Math.round(img.height*w/img.width),c=document.createElement("canvas");c.width=w;c.height=h;
    var cx=c.getContext("2d",{willReadFrequently:true});cx.drawImage(img,0,0,w,h);
    var rs=await ZXingWASM.readBarcodes(cx.getImageData(0,0,w,h),{formats:["DataMatrix","QRCode","Code128","Code39"],tryHarder:true,tryRotate:true,tryInvert:true,tryDownscale:true});
    for(var i=0;i<rs.length;i++){var v=buscarVin(rs[i].text);if(v)return v}
    if(w>=img.width)break;
  }
  return null;
}
function cargarOcr(){return new Promise(function(ok,no){if(window.Tesseract)return ok();var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=ok;s.onerror=function(){no(new Error("sin conexión"))};document.head.appendChild(s)})}
async function leerVin(){
  var f=this.files[0],msg=$("#scanmsg");this.value="";if(!f)return;
  msg.textContent="Leyendo la foto...";
  try{
    var img=await createImageBitmap(f),vin=null;
    try{msg.textContent="Buscando el código 2D...";await cargarZx();vin=await leerCodigo(img)}catch(e){}
    if(!vin){
      var w=Math.min(1600,img.width),h=Math.round(img.height*w/img.width),c=document.createElement("canvas");c.width=w;c.height=h;
      var cx=c.getContext("2d");cx.filter="grayscale(1) contrast(1.4)";cx.drawImage(img,0,0,w,h);
      msg.textContent="Reconociendo texto (la primera vez puede demorar)...";
      await cargarOcr();
      var wk=await Tesseract.createWorker("eng");
      await wk.setParameters({tessedit_char_whitelist:"ABCDEFGHJKLMNPRSTUVWXYZ0123456789"});
      var res=await wk.recognize(c);await wk.terminate();
      vin=buscarVin(res.data.text);
    }
    if(vin){$("#vin").value=vin;autoVin();msg.textContent="Listo. Revisa que el VIN esté correcto antes de guardar."}
    else msg.textContent="No pude leer el VIN. Acércate, evita reflejos e inténtalo otra vez, o escríbelo a mano.";
  }catch(e){msg.textContent="No se pudo leer la foto (la primera vez necesita internet). Escríbelo a mano."}
}

  var v=data.filter(function(x){return x.vin===vin&&!x.fechaSalida})[0]||data.filter(function(x){return x.vin===vin})[0];
  if(!v){n.textContent="Este VIN no está en el inventario. Completa los datos a mano.";return}
  if(!$("#pmod").value)$("#pmod").value=v.modelo;if(!$("#pcol").value)$("#pcol").value=v.color;if(!$("#pven").value&&v.vendedor)$("#pven").value=v.vendedor;
  n.textContent="En el inventario: "+v.modelo+" "+v.version+" · "+v.ubic+" · "+(v.estado||"Disponible");
}
async function guardarEntrega(ev){
  ev.preventDefault();
  var g=function(i){return $("#"+i).value.trim()},er=$("#err"),vin=g("pvin").toUpperCase();
  if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){er.textContent="El VIN debe tener 17 caracteres (sin I, O ni Q).";return}
  if(!g("pmod")||!g("pcol")||!g("pven")||!g("pfi")||!g("phr")||!g("pfa")){er.textContent="Completa VIN, modelo, color, vendedor, fecha, hora y fecha de alistamiento.";return}
  var fe=editE?(g("pfe")||g("pfi")):g("pfi");
  if(g("pfa")>fe){er.textContent="El alistamiento no puede ser después de la fecha de entrega.";return}
  if((g("pes")==="Lista para entregar"||g("pes")==="Entregado")&&g("pgr")!=="OK"&&!confirm("El grabado de patente está pendiente. ¿Guardar igual?"))return;
  var r={vin:vin,modelo:g("pmod"),color:g("pcol"),vendedor:g("pven"),fecha_inicial:g("pfi"),fecha_entrega:fe,hora:g("phr"),fecha_alistamiento:g("pfa"),accesorios:g("pacc")||null,campanas:g("pcam")||null,grabado_patente:g("pgr"),preparador:g("ppr")||"Ignacio Castillo",estado:g("pes")};
  if(editE&&perfil.rol==="preparador")r={accesorios:r.accesorios,grabado_patente:r.grabado_patente,estado:r.estado};
  var x=editE?await db.from("entregas").update(r).eq("id",editE).select():await db.from("entregas").insert(r).select();
  if(x.error||!x.data.length){er.textContent="No se pudo guardar (revisa tu permiso o tu conexión).";return}
  await cargarEntregas();toast("Entrega guardada");editE=null;go("plan");
}

}

(function(){
  var ORD=["portada","inicio","plan","alertas"],HASH=["","inv","plan","alertas"],t0=null;
