async function cargar(){var q=db.from("vehiculos").select("*").order("created_at",{ascending:false});var fs=esVend()?invSel:sucSel;if(fs)q=q.eq("sucursal_id",fs);var r=await q;data=(r.data||[]).map(deDB)}
async function cargarTodo(){var p=await db.from("perfiles").select("*").eq("id",sesion.user.id).maybeSingle();perfil=p.data;if(perfil&&perfil.activo){await cargarCat();await cargarSuc();await cargar();await cargarEntregas();await cargarNotifs();suscribir()}}
async function guardarDB(v,er){var r=await db.from("vehiculos").update(aDB(v)).eq("id",v.id).select();if(r.error||!r.data.length){er.textContent=msgErr(r.error);await cargar();return false}return true}
async function insertarDB(v,er){var r=await db.from("vehiculos").insert(aDB(v)).select().single();if(r.error){er.textContent=msgErr(r.error);return null}return deDB(r.data)}
async function iniciar(){$("#app").innerHTML='<div class="empty">Cargando...</div>';var s=await db.auth.getSession();sesion=s.data.session;if(sesion)await cargarTodo();render()}
async function salir(){if(canal){db.removeChannel(canal);canal=null}await db.auth.signOut();sesion=null;perfil=null;data=[];SUC=[];sucSel="";invSel=null;try{sessionStorage.removeItem("sucSel")}catch(e){}document.body.className="";go("");render()}

function rutLimpio(s){return String(s||"").replace(/[^0-9kK]/g,"").toUpperCase()}
function rutValido(s){var r=rutLimpio(s);if(r.length<7||r.length>9)return false;var b=r.slice(0,-1),d=r.slice(-1),t=0,m=2;if(!/^\d+$/.test(b))return false;for(var i=b.length-1;i>=0;i--){t+=b.charAt(i)*m;m=m===7?2:m+1}var x=11-t%11;return(x===11?"0":x===10?"K":String(x))===d}
function rutFmt(s){var r=rutLimpio(s);return r.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g,".")+"-"+r.slice(-1)}
function rutEmail(s){return rutLimpio(s).slice(0,-1)+"@rut.inventario.app"}
function rutClave(s){return rutLimpio(s).slice(0,-1).slice(-4)+"-Ford"}
function ident(u){return u.rut||u.email}
async function entrar(){
  var em=$("#em").value.trim(),pw=$("#pw").value,er=$("#err");
  if(!em||!pw){er.textContent="Ingresa tu RUT y tu contraseña.";return}
  if(em.indexOf("@")>-1||!rutValido(em)){er.textContent="Ingresa tu RUT con su dígito verificador, por ejemplo 12.345.678-5.";return}
  var q=await db.rpc("email_de_rut",{r:rutFmt(em)}),id=(q&&q.data)||rutEmail(em);
  if(/^\d{4}$/.test(pw))pw=pw+"-Ford";
  var r=await db.auth.signInWithPassword({email:id,password:pw});
  if(r.error||!r.data.session){er.textContent="RUT o contraseña incorrectos.";return}
  sesion=r.data.session;await cargarTodo();render()
}
async function registrar(e){
  e.preventDefault();var n=$("#rn").value.trim(),rt=$("#rr").value,er=$("#err");
  if(!n){er.textContent="Escribe tu nombre y apellido.";return}
  if(!rutValido(rt)){er.textContent="El RUT no es válido. Escríbelo con su dígito verificador, por ejemplo 12.345.678-5.";return}
  var r=await db.auth.signUp({email:rutEmail(rt),password:rutClave(rt),options:{data:{nombre:n,rut:rutFmt(rt)}}});
  if(r.error){er.textContent=/registered|exists/i.test(r.error.message||"")?"Ese RUT ya tiene cuenta. Vuelve e inicia sesión con los últimos 4 dígitos de tu RUT.":"No se pudo crear la cuenta: "+r.error.message;return}
  var ses=r.data&&r.data.session;
  if(!ses){var x=await db.auth.signInWithPassword({email:rutEmail(rt),password:rutClave(rt)});ses=x.data&&x.data.session}
  if(!ses){er.textContent="Cuenta creada, pero no se pudo entrar sola. Vuelve e inicia sesión con tu RUT.";return}
  sesion=ses;modoReg=false;await cargarTodo();render()
}
function render(){
  var a=$("#app");$("#nav").hidden=true;document.body.classList.remove("conav");
  if(recup){a.innerHTML=recupView();$("#fRec").onsubmit=guardarClave;return}
  if(!sesion){if(modoReg){a.innerHTML=regView();$("#fReg").onsubmit=registrar;$("#vlg").onclick=function(){modoReg=false;render()}}else{a.innerHTML=loginView();$("#fLog").onsubmit=function(e){e.preventDefault();entrar()};$("#reg").onclick=function(){modoReg=true;render()};$("#olv").onclick=olvide}return}
  if(perfil&&perfil.clave_cambiada===false){a.innerHTML=recupView(true);$("#fRec").onsubmit=guardarClave;return}
  if(perfil&&!perfil.activo&&perfil.rol!=="admin"&&!perfil.sucursal_pedida){elegirAcceso();return}
  var pend=!perfil||!perfil.activo,sinS=!pend&&!esAdm()&&!SUC.length;
  if(pend||sinS){a.innerHTML='<header><h1>Cuenta pendiente</h1></header><div class="panel">Tu cuenta ('+esc(perfil?ident(perfil):sesion.user.email)+') '+(pend?'está esperando la aprobación de un administrador'+(perfil&&perfil.rol_pedido?' (solicitaste ser '+esc(perfil.rol_pedido)+').':'.'):'todavía no tiene una sucursal activa asignada. Pídele al administrador que te asigne una.')+'</div><button class="btn g full" id="rt">Reintentar</button>'+(pend&&perfil&&perfil.sucursal_pedida?'<button class="btn g full" id="cs">Cambiar mi solicitud</button>':'')+'<button class="btn g full" onclick="salir()">Cerrar sesión</button>';$("#rt").onclick=async function(){await cargarTodo();render()};if($("#cs"))$("#cs").onclick=function(){perfil.sucursal_pedida=null;render()};return}
  document.body.className="r-"+perfil.rol+(esAdm()?" r-admin":"");
  var v=vista();
  if(["sucursales","sucursal","cfginv","cfgplan","historial"].indexOf(v)>-1&&!esAdm()){go("");return}
  renderApp();
  if(v==="plan")cargarEntregas().then(function(){if(vista()==="plan")listaPlan()});
  if(v==="inicio"||v==="inventario"||v==="salida")cargar().then(function(){if(vista()===v&&(v!=="salida"||!$("#m").value))renderApp()});
}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function hoy(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function fmt(f){if(!f)return"";var p=f.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function opts(arr,ph){return '<option value="">'+ph+'</option>'+arr.map(function(x){return'<option>'+esc(x)+'</option>'}).join("")}
function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
function stock(){return data.filter(function(v){return!v.fechaSalida})}
function go(v){location.hash=v}
function vista(){var h=location.hash.slice(1).split("/")[0];if(h==="inv"||h==="inventario")return"inicio";return["ingresar","salida","inventario","editar","sucursales","sucursal","cfginv","cfgplan","historial","plan","pform","alertas"].indexOf(h)>-1?h:"portada"}

async function leerCodigo(img){
  var tam=[1600,2400];
  for(var k=0;k<tam.length;k++){
    var w=Math.min(tam[k],img.width),h=Math.round(img.height*w/img.width),c=document.createElement("canvas");c.width=w;c.height=h;
    var cx=c.getContext("2d",{willReadFrequently:true});cx.drawImage(img,0,0,w,h);
    var rs=await ZXingWASM.readBarcodes(cx.getImageData(0,0,w,h),{formats:["DataMatrix","QRCode","Code128","Code39"],tryHarder:true,tryRotate:true,tryInvert:true,tryDownscale:true});
    for(var i=0;i<rs.length;i++){var v=buscarVin(rs[i].text);if(v)return v}
    if(w>=img.width)break;
  }
  return null;
}
function cargarOcr(){return new Promise(function(ok,no){if(window.Tesseract)return ok();var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=ok;s.onerror=function(){no(new Error("sin conexión"))};document.head.appendChild(s)})}
async function leerVin(){
  var f=this.files[0],msg=$("#scanmsg");this.value="";if(!f)return;
  msg.textContent="Leyendo la foto...";
  try{
    var img=await createImageBitmap(f),vin=null;
    try{msg.textContent="Buscando el código 2D...";await cargarZx();vin=await leerCodigo(img)}catch(e){}
    if(!vin){
      var w=Math.min(1600,img.width),h=Math.round(img.height*w/img.width),c=document.createElement("canvas");c.width=w;c.height=h;
      var cx=c.getContext("2d");cx.filter="grayscale(1) contrast(1.4)";cx.drawImage(img,0,0,w,h);
      msg.textContent="Reconociendo texto (la primera vez puede demorar)...";
      await cargarOcr();
      var wk=await Tesseract.createWorker("eng");
      await wk.setParameters({tessedit_char_whitelist:"ABCDEFGHJKLMNPRSTUVWXYZ0123456789"});
      var res=await wk.recognize(c);await wk.terminate();
      vin=buscarVin(res.data.text);
    }
    if(vin){$("#vin").value=vin;autoVin();msg.textContent="Listo. Revisa que el VIN esté correcto antes de guardar."}
    else msg.textContent="No pude leer el VIN. Acércate, evita reflejos e inténtalo otra vez, o escríbelo a mano.";
  }catch(e){msg.textContent="No se pudo leer la foto (la primera vez necesita internet). Escríbelo a mano."}
}
